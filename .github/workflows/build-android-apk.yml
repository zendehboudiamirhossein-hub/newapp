name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No gradlew/gradle-wrapper.jar is committed to this repo, so Gradle itself
      # is provisioned by this action instead of a wrapper script.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Make prepare-deps.sh executable
        run: chmod +x scripts/prepare-deps.sh

      # Downloads the pinned Xray AAR (slimmed to arm64-v8a), the Vazirmatn fonts,
      # and third-party license texts into app/libs, app/src/main/res/font and
      # app/src/main/assets/licenses. None of these are committed to the repo.
      - name: Prepare native/library dependencies
        run: scripts/prepare-deps.sh

      # VPN_API_BASE_URL and VPN_APP_API_KEY are read by app/build.gradle.kts via
      # providers.gradleProperty(...), so they are passed in as -P properties here
      # rather than committed anywhere in the source tree.
      - name: Build debug APK
        env:
          VPN_API_BASE_URL: ${{ secrets.VPN_API_BASE_URL }}
          VPN_APP_API_KEY: ${{ secrets.VPN_APP_API_KEY }}
        run: |
          gradle :app:assembleDebug \
            -PVPN_API_BASE_URL="${VPN_API_BASE_URL}" \
            -PVPN_APP_API_KEY="${VPN_APP_API_KEY}" \
            --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Man-Android-v1.0.2-arm64
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
